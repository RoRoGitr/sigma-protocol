	  function applyTheme(themeId, persistRemote) {
	    if (themeId === 'catppuccin-mocha') themeId = 'catppuccin';
	    var theme = THEMES[themeId];
    if (!theme) return;

    var root = document.documentElement;
    var vars = theme.vars;
    var keys = Object.keys(vars);
    for (var i = 0; i < keys.length; i++) {
      root.style.setProperty(keys[i], vars[keys[i]]);
    }

    /* Update active dot */
    var dots = document.querySelectorAll('.theme-dot');
    for (var d = 0; d < dots.length; d++) {
      if (dots[d].getAttribute('data-theme') === themeId) {
        dots[d].classList.add('active');
      } else {
        dots[d].classList.remove('active');
      }
    }

    /* Update theme name display */
    var nameDisplay = document.getElementById('theme-name-display');
    if (nameDisplay) {
      nameDisplay.textContent = theme.label;
    }

	    /* Persist theme preference */
	    try { localStorage.setItem('sigmahq-theme', themeId); } catch(e) {}
	    if (persistRemote !== false && isLiveApiEnabled()) {
	      fetch('/api/settings/theme', {
	        method: 'POST',
	        headers: {'Content-Type': 'application/json'},
	        body: JSON.stringify({theme: themeId})
	      }).catch(function() {});
	    }
	  }

    if (!footer) return;

    var switcher = el('div', 'theme-switcher');

    label.textContent = 'Theme';
    switcher.appendChild(label);

    var dotsRow = el('div', 'theme-dots');

    var themeKeys = Object.keys(THEMES);
    for (var i = 0; i < themeKeys.length; i++) {
      (function(id) {
        var theme = THEMES[id];
        var dot = el('button', 'theme-dot');
        dot.setAttribute('data-theme', id);
        dot.setAttribute('aria-label', 'Switch to ' + theme.label + ' theme');
        dot.setAttribute('title', theme.label);

	        dot.addEventListener('click', function() {
	          applyTheme(id, true);

        dotsRow.appendChild(dot);

  try {

	    if (stored === 'catppuccin-mocha') stored = 'catppuccin';
	    if (stored && THEMES[stored]) {

	    } else {
	      var injected = (typeof __THEME__ !== 'undefined') ? __THEME__ : '';
	      if (injected === 'catppuccin-mocha') injected = 'catppuccin';
	      if (injected && injected !== '__' + 'THEME' + '__' && THEMES[injected]) {

  /* ── Live Data Streaming (hot swap — no page reload) ── */

  if (isLiveApiEnabled()) {

    /* ── Workspace Data Polling — fetch /api/workspaces every 30s ── */
    /* Swaps WORKSPACES data in place, re-renders current view. No reload. */
    setInterval(function() {
      fetch('/api/workspaces', { cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(freshData) {
          var changed = false;
          for (var ws in freshData) {
            if (!WORKSPACES[ws] || JSON.stringify(WORKSPACES[ws]) !== JSON.stringify(freshData[ws])) {
              changed = true;
              break;
            }
          }
          for (var ws2 in WORKSPACES) {
            if (!freshData[ws2]) { changed = true; break; }
          }
          if (!changed) return;
          /* Hot swap the data — no page reload */
          for (var key in freshData) { WORKSPACES[key] = freshData[key]; }
          /* Re-render ONLY the current view — preserve navigation */
          if (currentView === 'kanban' && currentWorkspace) {
            renderKanban(currentWorkspace);
          } else if (currentView === 'dashboard') {
            renderDashboard();
          } else if (currentView === 'overview') {
            renderOverview();
          }
        })
        .catch(function() { /* workspaces API unavailable */ });
    }, 30000);

    /* ── Live Agent Polling — fetch /api/agents every 30s ── */
    setInterval(function() {
      fetch('/api/agents', { cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          _diffAgentActivity(data.agents || []);
          AGENT_DATA.agents = data.agents || [];
          AGENT_DATA.total_running = data.total_running || 0;
          AGENT_DATA.total_completed_today = data.total_completed_today || 0;
          AGENT_DATA.last_scan = data.last_scan || '';
          if (currentView === 'dispatch') {
            renderDispatch();
          }
        })

	    }, 30000);

	        })
	        .catch(function() {});
	      fetch('/api/leaderboard', { cache: 'no-store' })
	        .then(function(r) { return r.json(); })
	        .then(function(data) {
	          LEADERBOARD_DATA = data || LEADERBOARD_DATA;
	          if (currentView === 'dashboard') renderDashboard();
	        })
	        .catch(function() {});
	      fetch('/api/reviews?status=pending_review&limit=50', { cache: 'no-store' })
	        .then(function(r) { return r.json(); })
	        .then(function(data) {
	          REVIEW_DATA.items = (data && data.items) ? data.items : [];
	          if (currentView === 'dashboard') renderDashboard();
	          if (currentView === 'dispatch') renderDispatch();
	        })
	        .catch(function() {});
	    }
	    refreshLiveSummary();
	    setInterval(refreshLiveSummary, 30000);

    for (var _i = 0; _i < AGENT_DATA.agents.length; _i++) {
      if (AGENT_DATA.agents[_i].status === 'running') {

  /* ── SSE Subscription ── */
  var _sseSource = null;
  var _sseReconnectTimer = null;
  function connectSSE() {
    if (_sseSource) { try { _sseSource.close(); } catch(e){} }
    _sseSource = new EventSource('/api/stream');
    var statusEl = document.getElementById('v3-sse-status');
    _sseSource.onopen = function() {
      if (statusEl) statusEl.textContent = 'SSE: connected';
      if (statusEl) statusEl.style.color = 'var(--green)';
    };
    _sseSource.onmessage = function(e) {
      try {
        var msg = JSON.parse(e.data);
        if (msg.type === 'agent_update') {
          if (msg.agents) {
            AGENT_DATA.agents = msg.agents;
            AGENT_DATA.total_running = msg.total_running || 0;
          }
          var ac = document.getElementById('v3-agent-count');
          if (ac) ac.textContent = (AGENT_DATA.total_running || 0) + ' running';
        } else if (msg.type === 'session_transition') {
          var lr = document.getElementById('v3-last-reaction');
          if (lr) lr.textContent = 'Last: ' + (msg.ticket_id || '') + ' ' + (msg.from || '') + ' \u2192 ' + (msg.to || '');
        }
      } catch(ex) {}
    };
    _sseSource.onerror = function() {
      if (statusEl) { statusEl.textContent = 'SSE: disconnected'; statusEl.style.color = 'var(--red)'; }
      try { _sseSource.close(); } catch(e) {}
      _sseReconnectTimer = setTimeout(connectSSE, 5000);
    };
  }

    _paletteInput.addEventListener('input', filterPalette);
    _paletteInput.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); _paletteSelected = Math.min(_paletteSelected + 1, _paletteResults.children.length - 1); highlightPaletteItem(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); _paletteSelected = Math.max(_paletteSelected - 1, 0); highlightPaletteItem(); }
      else if (e.key === 'Enter') { e.preventDefault(); executePaletteItem(); }
      else if (e.key === 'Escape') { closePalette(); }

    _paletteEl.appendChild(_paletteInput);

  function openPalette() {
    buildPalette();
    _paletteVisible = true;
    _paletteEl.style.display = 'flex';
    document.getElementById('v3-palette-backdrop').style.display = 'block';
    _paletteInput.value = '';
    _paletteSelected = 0;
    filterPalette();
    _paletteInput.focus();
  }

  function closePalette() {
    if (!_paletteEl) return;
    _paletteVisible = false;
    _paletteEl.style.display = 'none';
    document.getElementById('v3-palette-backdrop').style.display = 'none';
  }

  function filterPalette() {
    var query = (_paletteInput.value || '').toLowerCase();
    while (_paletteResults.firstChild) _paletteResults.removeChild(_paletteResults.firstChild);
    _paletteSelected = 0;
    var matched = PALETTE_ACTIONS.filter(function(a) {
      return a.label.toLowerCase().indexOf(query) !== -1;
    });
    for (var i = 0; i < matched.length; i++) {
      (function(item, idx) {
        var row = el('div');
        row.style.cssText = 'padding:10px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;';
        row.addEventListener('mouseenter', function() { _paletteSelected = idx; highlightPaletteItem(); });
        row.addEventListener('click', function() { _paletteSelected = idx; executePaletteItem(); });
        var lbl = el('span');
        lbl.textContent = item.label;
        lbl.style.color = 'var(--text)';
        row.appendChild(lbl);
        if (item.shortcut) {
          var kbd = el('span');
          kbd.textContent = item.shortcut;
          kbd.style.cssText = 'font-size:11px;padding:2px 6px;background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text-dim);';
          row.appendChild(kbd);
        }
        row.dataset.idx = String(idx);
        _paletteResults.appendChild(row);
      })(matched[i], i);
    }
    highlightPaletteItem();
  }

  function highlightPaletteItem() {
    var items = _paletteResults.children;
    for (var i = 0; i < items.length; i++) {
      items[i].style.background = i === _paletteSelected ? 'var(--surface-hover)' : 'transparent';
    }
  }

  function executePaletteItem() {
    var items = _paletteResults.children;
    if (!items[_paletteSelected]) return;
    var query = (_paletteInput.value || '').toLowerCase();
    var matched = PALETTE_ACTIONS.filter(function(a) {
      return a.label.toLowerCase().indexOf(query) !== -1;
    });
    if (matched[_paletteSelected]) {
      closePalette();
      matched[_paletteSelected].action();
    }
  }

      return;
    }

    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      if (_paletteVisible) closePalette(); else openPalette();
      return;
    }

    if (e.key === 'Escape') { if (_paletteVisible) closePalette(); return; }
    if (_paletteVisible) return;

	    var keyMap = { 'd': 'dashboard', 'k': 'kanban', 'r': 'dispatch', 'o': 'overview', 'a': 'activity' };
	    if (keyMap[e.key]) {
	      e.preventDefault();
	      openView(keyMap[e.key], keyMap[e.key] === 'kanban' ? (currentWorkspace || 'personal') : undefined);
	      return;
	    }

	    var viewOrder = ['dashboard', 'kanban', 'dispatch', 'overview', 'activity'];
	    var num = parseInt(e.key);
	    if (num >= 1 && num <= viewOrder.length) {
	      e.preventDefault();
	      openView(viewOrder[num - 1], viewOrder[num - 1] === 'kanban' ? (currentWorkspace || 'personal') : undefined);
	      return;
	    }

    if (e.key === '?') {
      e.preventDefault();
      openPalette();
    }
  });

})();
</script>
