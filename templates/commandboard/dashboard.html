  /* ── Helpers ── */

  function el(tag, className) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    return node;
  }

  function txt(tag, text, className) {
    var node = el(tag, className);
    node.textContent = text;
    return node;
  }

  function clear(node) {
    while (node.firstChild) {
      node.removeChild(node.firstChild);
    }
  }

  function getWorkspaceColor(name) {
    var names = getSortedWorkspaceNames();
    var idx = names.indexOf(name);
    if (idx < 0) idx = 0;
    return PROJECT_COLORS[idx % PROJECT_COLORS.length];
  }

  function getSortedWorkspaceNames() {
    var names = Object.keys(WORKSPACES);
    names.sort(function(a, b) {
      if (a === 'personal') return -1;
      if (b === 'personal') return 1;
      return a.localeCompare(b);
    });
    return names;
  }

  function getAllTasks() {
    var all = [];
    var names = getSortedWorkspaceNames();
    for (var i = 0; i < names.length; i++) {
      var tasks = WORKSPACES[names[i]];
      for (var j = 0; j < tasks.length; j++) {
        var t = tasks[j];
        t._workspace = names[i];
        all.push(t);
      }
    }
    return all;
  }

  function sortByPriorityThenStatus(a, b) {
    var pa = PRIORITY_ORDER[a.priority] !== undefined ? PRIORITY_ORDER[a.priority] : 99;
    var pb = PRIORITY_ORDER[b.priority] !== undefined ? PRIORITY_ORDER[b.priority] : 99;
    if (pa !== pb) return pa - pb;
    var sa = STATUS_ORDER[a.status] !== undefined ? STATUS_ORDER[a.status] : 99;
    var sb = STATUS_ORDER[b.status] !== undefined ? STATUS_ORDER[b.status] : 99;
    return sa - sb;
  }

  function getTopPriorityTasks(count) {
    var all = getAllTasks().filter(function(t) { return t.status !== 'done'; });
    all.sort(sortByPriorityThenStatus);
    return all.slice(0, count);
  }

  function getActiveTasks() {
    return getAllTasks().filter(function(t) {
      return t.status === 'doing' ||
        ((t.priority === 'critical' || t.priority === 'high') && t.status === 'todo');
    });
  }

  function getRecentlyDone(count) {
    var done = getAllTasks().filter(function(t) { return t.status === 'done'; });
    done.sort(function(a, b) {
      var da = a.completed || a.updated || '';
      var db = b.completed || b.updated || '';
      return db.localeCompare(da);
    });
    return done.slice(0, count);
  }

  function formatTime12(str) {
    if (!str) return '';
    var parts = str.split(':');
    var h = parseInt(parts[0], 10);
    var m = parts.length > 1 ? parseInt(parts[1], 10) : 0;
    var suffix = h >= 12 ? 'PM' : 'AM';
    var hour12 = h % 12 || 12;
    return m === 0 ? hour12 + ' ' + suffix : hour12 + ':' + (m < 10 ? '0' : '') + m + ' ' + suffix;
  }

  function truncate(str, len) {
    if (!str) return '';
    str = str.trim();
    if (str.length <= len) return str;
    return str.slice(0, len) + '...';
  }

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function formatDate(d) {
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }

	  function formatShortDate(d) {
	    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
	    return months[d.getMonth()] + ' ' + d.getDate();
	  }

	  function dateKey(d) {
	    var y = d.getFullYear();
	    var m = String(d.getMonth() + 1).padStart(2, '0');
	    var day = String(d.getDate()).padStart(2, '0');
	    return y + '-' + m + '-' + day;
	  }

  function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();
  }

  function getWeekDays() {
    var today = new Date();
    var dayOfWeek = today.getDay();
    var monday = new Date(today);
    var diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    monday.setDate(today.getDate() + diff);
    var days = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push(d);
    }
    return days;
  }

  function createDonutChart(total, done, doing, todo, backlog) {
    var size = 80;
    var stroke = 6;
    var radius = (size - stroke) / 2;
    var circumference = 2 * Math.PI * radius;
    var cx = size / 2;
    var cy = size / 2;

    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    svg.style.display = 'block';

    // Background ring
    var bgCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    bgCircle.setAttribute('cx', cx);
    bgCircle.setAttribute('cy', cy);
    bgCircle.setAttribute('r', radius);
    bgCircle.setAttribute('fill', 'none');
    bgCircle.setAttribute('stroke', cssVar('--surface'));
    bgCircle.setAttribute('stroke-width', stroke);
    svg.appendChild(bgCircle);

    if (total === 0) {
      // Empty state — dashed ring
      bgCircle.setAttribute('stroke-dasharray', '4 4');
      bgCircle.setAttribute('stroke', cssVar('--border'));

      var emptyText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      emptyText.setAttribute('x', cx);
      emptyText.setAttribute('y', cy);
      emptyText.setAttribute('text-anchor', 'middle');
      emptyText.setAttribute('dominant-baseline', 'central');
      emptyText.setAttribute('fill', cssVar('--text-faint'));
      emptyText.setAttribute('font-size', '10');
      emptyText.setAttribute('font-family', 'inherit');
      emptyText.textContent = '0';
      svg.appendChild(emptyText);
      return svg;
    }

    // Segments: done (green), doing (amber), todo (blue), backlog (gray)
    var segments = [
      { count: done, color: cssVar('--green') },
      { count: doing, color: cssVar('--amber') },
      { count: todo, color: cssVar('--blue') },
      { count: backlog, color: cssVar('--text-faint') }
    ];

    var offset = -circumference / 4; // start at top
    for (var i = 0; i < segments.length; i++) {
      if (segments[i].count === 0) continue;
      var pct = segments[i].count / total;
      var segLen = pct * circumference;

      var arc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      arc.setAttribute('cx', cx);
      arc.setAttribute('cy', cy);
      arc.setAttribute('r', radius);
      arc.setAttribute('fill', 'none');
      arc.setAttribute('stroke', segments[i].color);
      arc.setAttribute('stroke-width', stroke);
      arc.setAttribute('stroke-dasharray', segLen + ' ' + (circumference - segLen));
      arc.setAttribute('stroke-dashoffset', '' + (-offset));
      arc.setAttribute('stroke-linecap', 'round');
      svg.appendChild(arc);

      offset += segLen;
    }

    // Center text — completion percentage
    var pctDone = Math.round((done / total) * 100);
    var centerText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    centerText.setAttribute('x', cx);
    centerText.setAttribute('y', cy - 4);
    centerText.setAttribute('text-anchor', 'middle');
    centerText.setAttribute('dominant-baseline', 'central');
    centerText.setAttribute('fill', cssVar('--text'));
    centerText.setAttribute('font-size', '16');
    centerText.setAttribute('font-weight', '700');
    centerText.setAttribute('font-family', 'inherit');
    centerText.textContent = pctDone + '%';
    svg.appendChild(centerText);

    // Sub text — total count
    var subText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    subText.setAttribute('x', cx);
    subText.setAttribute('y', cy + 14);
    subText.setAttribute('text-anchor', 'middle');
    subText.setAttribute('dominant-baseline', 'central');
    subText.setAttribute('fill', cssVar('--text-dim'));
    subText.setAttribute('font-size', '9');
    subText.setAttribute('font-family', 'inherit');
    subText.textContent = total + ' tasks';
    svg.appendChild(subText);

    return svg;
  }

  function buildDeployCommand(workspace, taskId, engine) {
    engine = engine || _dispatchEngine || 'claude';
    var engineLabel = engine === 'codex' ? 'codex' : 'claude';
    return '~/.commandboard/dispatch.sh task ' + workspace + ' ' + taskId + ' --engine ' + engineLabel;
  }

  function _resetDeployButton(btn, label) {
    setTimeout(function() {
      btn.disabled = false;
      btn.textContent = label;
      btn.style.color = '';
    }, 3000);
  }

  function launchTaskDeploy(ticketId, taskId, title, workspace, engine, btn) {
    _dispatchEngine = engine;
    btn.textContent = 'Deploying...';
    btn.disabled = true;
    fetch('/api/deploy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ticketId: ticketId,
        task_id: taskId,
        title: title,
        workspace: workspace,
        engine: engine
      })
    }).then(function(r) { return r.json(); }).then(function(d) {
      if (d.error) {
        btn.textContent = 'Err: ' + d.error.substring(0, 24);
        btn.style.color = 'var(--red)';
      } else {
        btn.textContent = engine === 'codex' ? 'Codex Opened!' : 'Claude Opened!';
        btn.style.color = 'var(--green)';
      }
      _resetDeployButton(btn, 'Deploy Now');
    }).catch(function() {
      btn.textContent = 'Failed';
      btn.style.color = 'var(--red)';
      _resetDeployButton(btn, 'Deploy Now');
    });
  }

        var stItem = el('div', 'ticket-modal-subtask');
        if (subTasks[si].done) stItem.classList.add('ticket-modal-subtask-done');
        var checkIcon = el('span', 'ticket-modal-subtask-check');
        checkIcon.textContent = subTasks[si].done ? '\u2611' : '\u2610';
        checkIcon.style.color = subTasks[si].done ? 'var(--green)' : 'var(--text-dim)';
        stItem.appendChild(checkIcon);
        stItem.appendChild(txt('span', subTasks[si].text, 'ticket-modal-subtask-text'));
        stList.appendChild(stItem);
      }
      stVal.appendChild(stList);
      stRow.appendChild(stVal);
      body.appendChild(stRow);
    }

    /* Linked PR */
    var linkedPR = parseLinkedPR(task.body);
    if (linkedPR) {
      var prRow = el('div', 'task-modal-row');
      prRow.appendChild(txt('div', 'Linked PR', 'task-modal-label'));
      prRow.appendChild(txt('div', linkedPR, 'task-modal-value'));
      body.appendChild(prRow);
    }

    /* Labels row */
    var allLabels = (task.tags || []).concat(task.labels || []);
    if (allLabels.length > 0) {
      var lblRow = el('div', 'task-modal-row');
      lblRow.appendChild(txt('div', 'Labels', 'task-modal-label'));
      var lblVal = el('div', 'task-modal-value');
      var lblBadges = el('div', 'task-modal-badges');
      for (var li = 0; li < allLabels.length; li++) {
        lblBadges.appendChild(txt('span', allLabels[li], 'task-modal-tag'));
      }
      lblVal.appendChild(lblBadges);
      lblRow.appendChild(lblVal);
      body.appendChild(lblRow);
    }

    /* Dispatch row — D4 Copy buttons + PTY Deploy buttons (C1 modal-parity fix; C1.2 cascade lookup) */
    /* 3-tier resolution: (1) task object → (2) GLOBAL_TASK_DISPATCH_MAP → (3) inline template fallback.
       Modal ALWAYS renders the dispatch row, never gated on data presence. */
    var dispatchPrompts = (task && task.dispatch_prompts);
    if (!dispatchPrompts && typeof GLOBAL_TASK_DISPATCH_MAP === 'object') {
      var lookupKey = (task._workspace || '') + ':' + String(task.id || '');
      dispatchPrompts = GLOBAL_TASK_DISPATCH_MAP[lookupKey] || DISPATCH_MAP[String(task.id)];
    }
    if (!dispatchPrompts) {
      /* Inline fallback — derive prompts from task fields. Mirror emit_kanban_prompt.py shapes. */
      var _title = task.title || 'Untitled task';
      var _ws = task._workspace || '(unknown workspace)';
      var _id = task.id || '?';
      var _body = (task.body || '').trim() || 'No additional details — see workspace kanban board.';
      var _status = task.status || 'todo';
      var _priority = task.priority || 'medium';
      dispatchPrompts = {
        claude: '<context>\nKanban task in workspace: ' + _ws + '\nID: ' + _id + ' | Status: ' + _status + ' | Priority: ' + _priority + '\n</context>\n\n<task>\n' + _title + '\n</task>\n\n<details>\n' + _body + '\n</details>\n\n<done-when>\nTask moved to "done" in kanban board with acceptance criteria met.\n</done-when>',
        codex: 'You are a senior engineer working on a kanban task in workspace `' + _ws + '`. Bias to action, persist end-to-end, use apply_patch for diffs.\n\n# Objective\n' + _title + '\n\n# Context\n- Task ID: ' + _id + ' | Status: ' + _status + ' | Priority: ' + _priority + '\n\n# Details\n' + _body + '\n\n# Done when\n1. Implementation complete + tests pass\n2. No regressions\n3. Kanban status moved to "done"',
        droid: '# Mission: ' + _title + '\n\n## Goal\nComplete kanban task `' + _id + '` in workspace `' + _ws + '`.\n\n## Scope\n- In scope: ' + _body + '\n\n## Success criteria\nTask moved to status "done" with all acceptance criteria met.'
      };
    }
    if (dispatchPrompts) {
      var dispRow = el('div', 'task-modal-row');
      dispRow.appendChild(txt('div', 'Dispatch', 'task-modal-label'));
      var dispVal = el('div', 'task-modal-value');

      /* D4 Copy-prompt buttons: 3 CLIs */
      var copyRow = el('div', 'task-dispatch-row');
      copyRow.setAttribute('data-prompt-claude', dispatchPrompts.claude || '');
      copyRow.setAttribute('data-prompt-codex', dispatchPrompts.codex || '');
      copyRow.setAttribute('data-prompt-droid', dispatchPrompts.droid || '');
      var clis = ['claude', 'codex', 'droid'];
      for (var ci = 0; ci < clis.length; ci++) {
        (function(cli) {
          var btn = el('button', 'task-dispatch-btn');
          btn.setAttribute('data-cli', cli);
          btn.setAttribute('aria-label', 'Copy ' + cli + ' prompt');
          var iconSpan = el('span', 'dispatch-icon');
          iconSpan.textContent = '\u{1F4CB}';
          btn.appendChild(iconSpan);
          btn.appendChild(document.createTextNode(' ' + cli.charAt(0).toUpperCase() + cli.slice(1)));
          copyRow.appendChild(btn);
        })(clis[ci]);
      }
      dispVal.appendChild(copyRow);

      /* Existing PTY Deploy buttons (uses createDeployButtons + openDeployEngineModal) */
      if (typeof createDeployButtons === 'function' && ws) {
        var deployWrap = el('div', 'task-modal-deploy');
        deployWrap.style.marginTop = '8px';
        deployWrap.appendChild(createDeployButtons(getTicketId(ws, task), task.id, task.title, ws));
        dispVal.appendChild(deployWrap);
      }

      dispRow.appendChild(dispVal);
      body.appendChild(dispRow);
    }

    /* Footer with ticket ID */
    var footer = el('div', 'task-modal-footer');
    footer.textContent = ws ? getTicketId(ws, task) : '#' + (task.id || '?');
    modal.appendChild(footer);

    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    /* Click overlay to close (but not the modal itself) */
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) {
        closeTaskModal();
      }
    });

    /* Animate in on next frame */
    requestAnimationFrame(function() {
      overlay.classList.add('visible');
    });

    /* Focus the close button for keyboard a11y */
    closeBtn.focus();
  }

  function closeTaskModal() {
    var overlay = document.querySelector('.task-modal-overlay');
    if (!overlay) return;
    overlay.classList.remove('visible');
    setTimeout(function() {
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }, 200);
  }

  /* Global Escape key listener for modal */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closeTaskModal();
      closeDeployEngineModal();
    }
  });

	  function switchView(view, workspace) {
	    if (view === 'review') view = 'dispatch';
	    currentView = view;
	    currentWorkspace = workspace || null;

    var views = ['dashboard', 'dispatch', 'overview', 'today', 'calendar', 'kanban', 'search', 'activity', 'dumps', 'content'];
    for (var i = 0; i < views.length; i++) {
      var viewEl = document.getElementById('view-' + views[i]);
      if (views[i] === view) {
        viewEl.classList.add('active');
      } else {
        viewEl.classList.remove('active');
      }
    }

	    updateActiveButtons();
	  }

  function createWsButton(name) {
    var tasks = WORKSPACES[name] || [];
    var active = tasks.filter(function(t) { return t.status !== 'done'; }).length;
    var displayName = name.replace(/^(products|community|tools|clients|incubating|archive)\//, '');

    var btn = el('button', 'ws-btn');
    btn.id = 'ws-' + name;
    btn.setAttribute('aria-label', 'Open ' + displayName + ' board');
    if (active === 0) btn.classList.add('empty-ws');

    var labelWrap = el('span');
    var dot = el('span');
    dot.style.display = 'inline-block';
    dot.style.width = '6px';
    dot.style.height = '6px';
    dot.style.borderRadius = '50%';
    dot.style.background = getWorkspaceColor(name);
    dot.style.marginRight = '8px';
    dot.style.verticalAlign = 'middle';
    labelWrap.appendChild(dot);
    var nameText = document.createTextNode(displayName);
    labelWrap.appendChild(nameText);

  function createFolder(label, icon, names) {
    var folder = el('div', 'ws-folder');

    var totalActive = 0;
    for (var i = 0; i < names.length; i++) {
      var tasks = WORKSPACES[names[i]] || [];
      totalActive += tasks.filter(function(t) { return t.status !== 'done'; }).length;
    }

    var header = el('button', 'ws-folder-header');

    var chevron = el('span', 'ws-folder-chevron');
    chevron.textContent = '\u25BE';
    header.appendChild(chevron);

    var iconEl = el('span', 'ws-folder-icon');
    iconEl.textContent = icon;
    header.appendChild(iconEl);

    var labelEl = el('span');
    labelEl.textContent = label;
    header.appendChild(labelEl);

    var countEl = el('span', 'ws-folder-count');
    countEl.textContent = names.length + (totalActive > 0 ? ' \u00b7 ' + totalActive + ' active' : '');
    header.appendChild(countEl);

    folder.appendChild(header);

	    var items = el('div', 'ws-folder-items');
	    var folderKey = label.toLowerCase();
	    var sectionState = (SIDEBAR_STATE.sections || {})[folderKey] || {};
	    items.style.maxHeight = (sectionState.height || (names.length * 40)) + 'px';
	    if (sectionState.collapsed) {
	      chevron.classList.add('collapsed');
	      items.classList.add('collapsed');
	    }

    for (var j = 0; j < names.length; j++) {
      items.appendChild(createWsButton(names[j]));
    }

    folder.appendChild(items);

	    header.addEventListener('click', function() {
	      chevron.classList.toggle('collapsed');
	      items.classList.toggle('collapsed');
	      SIDEBAR_STATE.sections = SIDEBAR_STATE.sections || {};
	      SIDEBAR_STATE.sections[folderKey] = SIDEBAR_STATE.sections[folderKey] || {};
	      SIDEBAR_STATE.sections[folderKey].collapsed = items.classList.contains('collapsed');
	      saveSidebarState();
	    });

	    var resize = el('div', 'ws-folder-resizer');
	    resize.title = 'Resize ' + label;
	    resize.addEventListener('mousedown', function(ev) {
	      ev.preventDefault();
	      ev.stopPropagation();
	      var startY = ev.clientY;
	      var startH = parseInt(items.style.maxHeight || '160', 10) || 160;
	      function move(mev) {
	        var nextH = Math.max(44, Math.min(520, startH + (mev.clientY - startY)));
	        items.style.maxHeight = nextH + 'px';
	      }
	      function up() {
	        document.removeEventListener('mousemove', move);
	        document.removeEventListener('mouseup', up);
	        SIDEBAR_STATE.sections = SIDEBAR_STATE.sections || {};
	        SIDEBAR_STATE.sections[folderKey] = SIDEBAR_STATE.sections[folderKey] || {};
	        SIDEBAR_STATE.sections[folderKey].height = parseInt(items.style.maxHeight, 10) || startH;
	        saveSidebarState();
	      }
	      document.addEventListener('mousemove', move);
	      document.addEventListener('mouseup', up);
	    });
	    folder.appendChild(resize);

	    return folder;
	  }

  function renderWorkspaceList() {
    var container = document.getElementById('sidebar-workspaces');
    clear(container);

	    var allNames = getSortedWorkspaceNames();
	    var pinnedSet = {};
	    var configuredPinned = SIDEBAR_STATE.pinned || [];
	    var activePinned = [];
	    for (var pp = 0; pp < configuredPinned.length; pp++) {
	      if (WORKSPACES[configuredPinned[pp]]) {
	        pinnedSet[configuredPinned[pp]] = true;
	        activePinned.push(configuredPinned[pp]);
	      }
	    }

	    /* Categorize workspaces by folder prefix (products/, community/, tools/, clients/, etc.) */
	    var products = [];
	    var community = [];
	    var tools = [];
	    var clients = [];
	    var incubating = [];
	    var archive = [];

	    for (var i = 0; i < allNames.length; i++) {
	      var name = allNames[i];
	      if (pinnedSet[name]) {
	        continue;
	      } else if (name === 'personal') {
	        activePinned.unshift(name);
	      } else if (name.indexOf('products/') === 0) {
	        products.push(name);
      } else if (name.indexOf('community/') === 0) {
        community.push(name);
      } else if (name.indexOf('tools/') === 0) {
        tools.push(name);
      } else if (name.indexOf('clients/') === 0) {
        clients.push(name);
      } else if (name.indexOf('incubating/') === 0) {
        incubating.push(name);
      } else if (name.indexOf('archive/') === 0) {
        archive.push(name);
      } else {
	        products.push(name);
	      }
	    }

	    var recent = (SIDEBAR_STATE.recent || []).filter(function(name) {
	      return WORKSPACES[name] && !pinnedSet[name];
	    });

	    for (var p = 0; p < activePinned.length; p++) {
	      container.appendChild(createWsButton(activePinned[p]));
	    }

	    if (recent.length > 0) {
	      container.appendChild(el('div', 'sidebar-divider'));
	      container.appendChild(createFolder('Recent', '\u25CE', recent));
	    }

	    if (activePinned.length > 0 && (products.length > 0 || clients.length > 0 || tools.length > 0 || community.length > 0 || incubating.length > 0 || archive.length > 0)) {
	      container.appendChild(el('div', 'sidebar-divider'));
	    }

    /* Products folder */
    if (products.length > 0) {
      container.appendChild(createFolder('Products', '\u25C6', products));
    }

    /* Clients folder */
    if (clients.length > 0) {
      container.appendChild(createFolder('Clients', '\u25A0', clients));
    }

    /* Tools folder */
    if (tools.length > 0) {
      container.appendChild(createFolder('Tools', '\u2699', tools));
    }

    /* Community folder */
    if (community.length > 0) {
      container.appendChild(createFolder('Community', '\u2606', community));
    }

    /* Incubating folder */
	    if (incubating.length > 0) {
	      container.appendChild(createFolder('Incubating', '\u269B', incubating));
	    }

	    if (archive.length > 0) {
	      container.appendChild(createFolder('Archive', '\u25A1', archive));
	    }
	  }

  /* ── Render: Topbar ── */

  function renderTopbar() {
    var topbar = document.getElementById('topbar');
    clear(topbar);

    var left = el('div', 'topbar-left');

    var title = el('div', 'topbar-title');

    if (currentView === 'dashboard') {
      title.textContent = 'Dashboard';
    } else if (currentView === 'dispatch') {
      title.textContent = 'Dispatch Center';
    } else if (currentView === 'overview') {
      title.textContent = 'All Projects';
    } else if (currentView === 'today') {
      title.textContent = 'Today';
    } else if (currentView === 'calendar') {
      title.textContent = 'This Week';
    } else if (currentView === 'kanban' && currentWorkspace) {
      title.textContent = currentWorkspace;
    } else if (currentView === 'search') {
      title.textContent = 'Search Results';
    } else if (currentView === 'activity') {
      title.textContent = 'Activity';
    }

    left.appendChild(title);

    var dateEl = el('span', 'topbar-date');
    dateEl.textContent = formatDate(new Date());
    left.appendChild(dateEl);

    topbar.appendChild(left);

    var stats = el('div', 'topbar-stats');

    if (currentView === 'dashboard') {
      var allDash = getAllTasks();
      var dashActive = allDash.filter(function(t) { return t.status === 'doing'; }).length;
      var dashDone = allDash.filter(function(t) { return t.status === 'done'; }).length;
      appendStat(stats, 'var(--blue)', allDash.length + ' tasks');
      appendStat(stats, 'var(--amber)', dashActive + ' active');
      appendStat(stats, 'var(--green)', dashDone + ' done');
    } else if (currentView === 'overview') {
      var totalTasks = 0;
      var totalDone = 0;
      var totalDoing = 0;
      var names = Object.keys(WORKSPACES);
      for (var i = 0; i < names.length; i++) {
        totalTasks += WORKSPACES[names[i]].length;
        totalDone += WORKSPACES[names[i]].filter(function(t) { return t.status === 'done'; }).length;
        totalDoing += WORKSPACES[names[i]].filter(function(t) { return t.status === 'doing'; }).length;
      }
      appendStat(stats, 'var(--text-dim)', names.length + ' workspaces');
      appendStat(stats, 'var(--blue)', totalTasks + ' tasks');
      appendStat(stats, 'var(--amber)', totalDoing + ' active');
      appendStat(stats, 'var(--green)', totalDone + ' done');
    } else if (currentView === 'today') {
      var active = getActiveTasks();
      var done = getRecentlyDone(999);
      appendStat(stats, 'var(--amber)', active.length + ' actionable');
      appendStat(stats, 'var(--green)', done.length + ' completed');
    } else if (currentView === 'calendar') {
      var allTasks = getAllTasks();
      var withDue = allTasks.filter(function(t) { return t.due; });
      appendStat(stats, 'var(--accent)', withDue.length + ' scheduled');
      appendStat(stats, 'var(--text-dim)', (allTasks.length - withDue.length) + ' unscheduled');
    } else if (currentView === 'kanban' && currentWorkspace) {
      var wsTasks = WORKSPACES[currentWorkspace] || [];
      var total = wsTasks.length;
      var wsDone = wsTasks.filter(function(t) { return t.status === 'done'; }).length;
      var wsActive = wsTasks.filter(function(t) { return t.status === 'doing'; }).length;
      appendStat(stats, 'var(--text-dim)', total + ' total');
      appendStat(stats, 'var(--amber)', wsActive + ' active');
      appendStat(stats, 'var(--green)', wsDone + ' done');
    } else if (currentView === 'dispatch') {
      appendStat(stats, 'var(--green)', AGENT_DATA.total_running + ' running');
      appendStat(stats, 'var(--purple)', (REVIEW_DATA.items || []).length + ' pending review');
      appendStat(stats, 'var(--text-dim)', AGENT_DATA.total_completed_today + ' completed today');
    } else if (currentView === 'activity') {
      var allT = getAllTasks();
      var withDates = allT.filter(function(t) { return t.updated || t.created; });
      appendStat(stats, 'var(--text-dim)', withDates.length + ' events');
    } else if (currentView === 'dumps') {
      appendStat(stats, 'var(--purple)', DUMPS_DATA.length + ' dumps');
      var uniqueThemes = {};
      for (var di = 0; di < DUMPS_DATA.length; di++) {
        for (var ti = 0; ti < DUMPS_DATA[di].themes.length; ti++) uniqueThemes[DUMPS_DATA[di].themes[ti]] = 1;
      }
      appendStat(stats, 'var(--text-dim)', Object.keys(uniqueThemes).length + ' projects referenced');
    }

    topbar.appendChild(stats);
  }

    wsByActive.sort(function(a, b) { return b.active - a.active; });

    var topProjects = wsByActive.slice(0, 3);

          dot.style.background = getWorkspaceColor(proj.name);

            taskTicketSpan.style.marginRight = '4px';

        var doing = tasks.filter(function(t) { return t.status === 'doing'; }).length;
        var review = tasks.filter(function(t) { return t.status === 'review'; }).length;

        colorDot.style.height = '8px';

        colorDot.style.marginRight = '8px';
        colorDot.style.verticalAlign = 'middle';
        nameRow.appendChild(colorDot);
        var nameEl = el('span', 'overview-name');
        nameEl.textContent = name;
        nameRow.appendChild(nameEl);
        header.appendChild(nameRow);

        if (total > 0 && done === total) {
          var badge = el('span', 'overview-card-badge');
          badge.style.background = 'var(--green-dim)';
          badge.style.color = 'var(--green)';
          badge.textContent = 'COMPLETE';
          header.appendChild(badge);
        } else if (doing > 0) {
          var badge2 = el('span', 'overview-card-badge');
          badge2.style.background = 'var(--amber-dim)';
          badge2.style.color = 'var(--amber)';
          badge2.textContent = 'ACTIVE';
          header.appendChild(badge2);
        }

        card.appendChild(header);

        /* Card body: stats on left, donut chart on right */
        var cardBody = el('div');
        cardBody.style.display = 'flex';
        cardBody.style.alignItems = 'center';
        cardBody.style.justifyContent = 'space-between';
        cardBody.style.marginTop = '8px';

        var leftSide = el('div');
        leftSide.style.flex = '1';

        var statsEl = el('div', 'overview-stats');
        if (total === 0) {
          var emptyItem = el('span', 'overview-stat-item');
          emptyItem.textContent = 'No tasks yet';
          statsEl.appendChild(emptyItem);
        } else {
          var parts = [
            { count: doing + review, label: 'active', color: 'var(--amber)' },
            { count: todo, label: 'todo', color: 'var(--blue)' },
            { count: backlog, label: 'backlog', color: 'var(--text-dim)' },
            { count: done, label: 'done', color: 'var(--green)' }
          ];
          for (var j = 0; j < parts.length; j++) {
            if (parts[j].count > 0) {
              var statItem = el('span', 'overview-stat-item');
              var sDot = el('span', 'stat-dot');
              sDot.style.background = parts[j].color;
              sDot.style.marginRight = '3px';
              statItem.appendChild(sDot);
              var sText = document.createTextNode(parts[j].count + ' ' + parts[j].label);
              statItem.appendChild(sText);
              statsEl.appendChild(statItem);
            }
          }
        }
        leftSide.appendChild(statsEl);

        if (total > 0) {
          var bar = el('div', 'overview-bar');
          bar.style.marginTop = '10px';
          var barSegments = el('div', 'overview-bar-segments');

          var donePct = Math.round((done / total) * 100);
          var doingPct = Math.round(((doing + review) / total) * 100);
          var todoPct = Math.round((todo / total) * 100);

          if (donePct > 0) {
            var doneBar = el('div', 'overview-bar-done');
            doneBar.style.width = donePct + '%';
            barSegments.appendChild(doneBar);
          }
          if (doingPct > 0) {
            var doingBar = el('div', 'overview-bar-doing');
            doingBar.style.width = doingPct + '%';
            barSegments.appendChild(doingBar);
          }
          if (todoPct > 0) {
            var todoBar = el('div', 'overview-bar-todo');
            todoBar.style.width = todoPct + '%';
            barSegments.appendChild(todoBar);
          }

          bar.appendChild(barSegments);
          leftSide.appendChild(bar);
        }

        cardBody.appendChild(leftSide);

        /* Donut chart on right */
        var chartWrap = el('div');
        chartWrap.style.marginLeft = '12px';
        chartWrap.style.flexShrink = '0';
        chartWrap.appendChild(createDonutChart(total, done, doing + review, todo, backlog));
        cardBody.appendChild(chartWrap);

        card.appendChild(cardBody);

        grid.appendChild(card);
      })(names[i]);
    }

    container.appendChild(grid);
  }

  /* ── Render: Calendar ── */

  var fcInstance = null;

  function renderCalendar() {
    var container = document.getElementById('view-calendar');
    clear(container);

    var scroll = el('div', 'calendar-view');
    var calEl = el('div');
    calEl.id = 'fullcalendar-mount';
    scroll.appendChild(calEl);

    /* Day detail panel (hidden until a day is clicked) */
    var dayDetailPanel = el('div');
    dayDetailPanel.id = 'day-detail-panel';
    scroll.appendChild(dayDetailPanel);

    container.appendChild(scroll);

    /* Build events from tasks */
    var allTasks = getAllTasks();
    var events = [];
    var priorityColors = {
      critical: cssVar('--red'),
      high: cssVar('--amber'),
      medium: cssVar('--blue'),
      low: cssVar('--text-dim')
    };

	    for (var i = 0; i < allTasks.length; i++) {
	      var t = allTasks[i];
	      if (t.status === 'done') continue;
	      if (t.due) {
        events.push({
          title: t.title,
          start: t.due,
          backgroundColor: priorityColors[t.priority] || priorityColors.low,
          borderColor: 'transparent',
          extendedProps: { task: t }
	        });
	      }
	    }

	    var scheduleBlocks = generateTimeBlocks();
	    for (var sb = 0; sb < scheduleBlocks.length; sb++) {
	      events.push(scheduleBlockToEvent(scheduleBlocks[sb]));
	    }

    /* Initialize FullCalendar */
    if (typeof FullCalendar !== 'undefined') {
      fcInstance = new FullCalendar.Calendar(calEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth'
        },
        height: 'auto',
        events: events,
        dateClick: function(info) {
          renderDayDetail(info.dateStr);
        },
	        eventClick: function(info) {
	          var task = info.event.extendedProps.task;
	          if (task) {
	            showTaskModal(task);
	            return;
	          }
	          if (info.event.extendedProps.scheduleBlock) {
	            renderDayDetail(info.event.startStr.slice(0, 10));
	          }
	        },
        firstDay: 1
      });
      fcInstance.render();
    } else {
      /* Fallback: render basic month grid if FullCalendar CDN fails */
      renderCalendarFallback(scroll, allTasks);
    }
  }

  function renderCalendarFallback(scroll, allTasks) {
    var grid = el('div', 'calendar-grid');
    var days = getWeekDays();
    var today = new Date();
    var dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    var activeTasks = allTasks.filter(function(t) { return t.status !== 'done'; });

    for (var i = 0; i < 7; i++) {
      (function(dayDate, dayIndex) {
        var isToday = isSameDay(dayDate, today);
        var dayCol = el('div', 'calendar-day');
        if (isToday) dayCol.classList.add('is-today');

        var header = el('div', 'calendar-day-header');
        header.appendChild(txt('span', dayNames[dayIndex], 'calendar-day-name'));
        header.appendChild(txt('span', formatShortDate(dayDate), 'calendar-day-date'));
        dayCol.appendChild(header);

	        var dayKey = dateKey(dayDate);
	        var dayTasks = [];
	        var dayBlocks = getScheduleBlocksForDate(dayKey);
	        for (var j = 0; j < activeTasks.length; j++) {
	          var t = activeTasks[j];
	          if (t.due && isSameDay(new Date(t.due), dayDate)) { dayTasks.push(t); continue; }
	          if (isToday && !t.due && (t.status === 'doing' || (t.status === 'todo' && (t.priority === 'high' || t.priority === 'critical')))) dayTasks.push(t);
	        }
	        dayTasks.sort(sortByPriorityThenStatus);

	        if (dayTasks.length > 0 || dayBlocks.length > 0) {
	          var countBadge = el('span', 'calendar-day-count');
	          countBadge.textContent = String(dayTasks.length + dayBlocks.length);
	          header.appendChild(countBadge);
	        }

	        var tasksContainer = el('div', 'calendar-tasks');
	        if (dayTasks.length === 0 && dayBlocks.length === 0) {
	          tasksContainer.appendChild(txt('div', isToday ? 'Clear' : '\u2014', 'calendar-empty'));
	        } else {
	          for (var b = 0; b < dayBlocks.length; b++) {
	            (function(block) {
	              var scheduleCard = el('div', 'calendar-task is-schedule');
	              scheduleCard.appendChild(txt('div', block.start + ' - ' + block.end, 'calendar-task-time'));
	              scheduleCard.appendChild(txt('div', truncate(block.title, 30), 'calendar-task-title'));
	              scheduleCard.appendChild(txt('div', block.workspace || block.type || 'schedule', 'calendar-task-project'));
	              scheduleCard.addEventListener('click', function() { renderDayDetail(dayKey); });
	              tasksContainer.appendChild(scheduleCard);
	            })(dayBlocks[b]);
	          }
	          for (var k = 0; k < dayTasks.length; k++) {
            (function(task) {
              var taskCard = el('div', 'calendar-task priority-' + task.priority);
              taskCard.appendChild(txt('div', truncate(task.title, 30), 'calendar-task-title'));
              taskCard.appendChild(txt('div', task._workspace, 'calendar-task-project'));
              taskCard.addEventListener('click', function() { showTaskModal(task); });
              tasksContainer.appendChild(taskCard);
            })(dayTasks[k]);
          }
        }

        dayCol.appendChild(tasksContainer);
        grid.appendChild(dayCol);
      })(days[i], i);
    }

    scroll.appendChild(grid);
  }

  function renderDayDetail(dateStr) {
    var panel = document.getElementById('day-detail-panel');
    if (!panel) return;
    clear(panel);

	    var dayDate = new Date(dateStr + 'T00:00:00');
	    var allTasks = getAllTasks().filter(function(t) { return t.status !== 'done'; });
	    var dayBlocks = getScheduleBlocksForDate(dateStr);

	    var dayTasks = allTasks.filter(function(t) {
	      return t.due && t.due === dateStr;
	    });

	    if (dayTasks.length === 0 && dayBlocks.length === 0) {
	      var empty = el('div', 'day-detail');
      var emptyHeader = el('div', 'day-detail-header');
      emptyHeader.appendChild(txt('span', formatDate(dayDate), 'day-detail-title'));
      var closeBtn = el('button', 'day-detail-close');
      closeBtn.textContent = 'Close';
      closeBtn.addEventListener('click', function() { clear(panel); });
      emptyHeader.appendChild(closeBtn);
      empty.appendChild(emptyHeader);
      empty.appendChild(txt('div', 'No tasks scheduled for this day', 'empty-state'));
      panel.appendChild(empty);
      return;
    }

    var detail = el('div', 'day-detail');
    var header = el('div', 'day-detail-header');
	    header.appendChild(txt('span', formatDate(dayDate) + ' \u2014 ' + (dayTasks.length + dayBlocks.length) + ' items', 'day-detail-title'));
    var closeBtn2 = el('button', 'day-detail-close');
    closeBtn2.textContent = 'Close';
    closeBtn2.addEventListener('click', function() { clear(panel); });
    header.appendChild(closeBtn2);
    detail.appendChild(header);

    /* Split into scheduled and unscheduled */
    var scheduled = dayTasks.filter(function(t) { return t.scheduled; });
    var unscheduled = dayTasks.filter(function(t) { return !t.scheduled; });

    /* Anytime section */
    if (unscheduled.length > 0) {
      var anytime = el('div', 'day-detail-anytime');
      anytime.appendChild(txt('div', 'ANYTIME', 'day-detail-section-label'));
      for (var u = 0; u < unscheduled.length; u++) {
        (function(task) {
          var row = el('div', 'compact-task');
          row.appendChild(createStatusDot(task.status));
          var title = el('span', 'compact-task-title');
          title.textContent = task.title;
          row.appendChild(title);
          row.appendChild(createPriorityTag(task.priority));
          row.addEventListener('click', function() { showTaskModal(task); });
          anytime.appendChild(row);
        })(unscheduled[u]);
      }
      detail.appendChild(anytime);
    }

	    /* Timeline for scheduled blocks */
	    if (scheduled.length > 0 || dayBlocks.length > 0) {
	      detail.appendChild(txt('div', 'SCHEDULED', 'day-detail-section-label'));
	      var timeline = el('div', 'day-detail-timeline');
	      var blockTypeColors = { deep: 'day-detail-block-deep', meeting: 'day-detail-block-meeting', admin: 'day-detail-block-admin', break: 'day-detail-block-break' };

      for (var h = 6; h <= 22; h++) {
        var hourRow = el('div', 'day-detail-hour');
        var label = el('div', 'day-detail-hour-label');
        label.textContent = formatTime12(h + ':00');
        hourRow.appendChild(label);

	        var content = el('div', 'day-detail-hour-content');
	        for (var bi = 0; bi < dayBlocks.length; bi++) {
	          var dailyBlock = dayBlocks[bi];
	          var blockStart = parseScheduleTime(dailyBlock.start);
	          if (blockStart && parseInt(blockStart.split(':')[0], 10) === h) {
	            var scheduleBlockEl = el('div', 'day-detail-block ' + (blockTypeColors[dailyBlock.type] || blockTypeColors.deep));
	            var scheduleTicket = dailyBlock.ticketId ? ' [' + dailyBlock.ticketId + ']' : '';
	            scheduleBlockEl.textContent = dailyBlock.title + scheduleTicket + ' (' + dailyBlock.start + '-' + dailyBlock.end + ')';
	            content.appendChild(scheduleBlockEl);
	          }
	        }
	        for (var si = 0; si < scheduled.length; si++) {
          var sTask = scheduled[si];
          var parts = sTask.scheduled.split('-');
          if (parts.length === 2) {
            var startHour = parseInt(parts[0].split(':')[0], 10);
            if (startHour === h) {
              var block = el('div', 'day-detail-block ' + (blockTypeColors.deep));
              block.textContent = sTask.title + ' (' + sTask.scheduled + ')';
              block.style.cursor = 'pointer';
              (function(task) {
                block.addEventListener('click', function() { showTaskModal(task); });
              })(sTask);
              content.appendChild(block);
            }
          }
        }
        hourRow.appendChild(content);
        timeline.appendChild(hourRow);
      }
      detail.appendChild(timeline);
    }

    panel.appendChild(detail);
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* ── Render: Kanban ── */

  function generateExecPrompt(name, tasks) {
    var active = tasks.filter(function(t) { return t.status !== 'done'; });
    active.sort(sortByPriorityThenStatus);
    var top = active.slice(0, 5);

    var lines = [];
    lines.push('You are working on the ' + name + ' project. Read your task board:');
    lines.push('kanban-md list --dir ~/.commandboard/workspaces/' + name + ' --table');
    lines.push('');

    if (top.length > 0) {
      lines.push('Your top priority tasks:');
      for (var i = 0; i < top.length; i++) {
        var t = top[i];
        var line = (i + 1) + '. ' + getTicketId(name, t) + ' ' + t.title + ' (' + t.priority + ')';
        if (t.assignee) {
          line += ' -> Use Agent tool with subagent_type=' + t.assignee;
        }
        lines.push(line);
      }
      lines.push('');

      /* Group tasks by agent for routing summary */
      var agentMap = {};
      var agentNames = [];
      for (var j = 0; j < top.length; j++) {
        var agent = top[j].assignee || 'unassigned';
        if (!agentMap[agent]) {
          agentMap[agent] = [];
          agentNames.push(agent);
        }
        agentMap[agent].push('#' + top[j].id);
      }

      /* Show agent grouping when multiple tasks share an agent */
      var hasGrouping = false;
      for (var k = 0; k < agentNames.length; k++) {
        if (agentMap[agentNames[k]].length > 1) {
          hasGrouping = true;
          break;
        }
      }

      if (hasGrouping || agentNames.length > 1) {
        lines.push('Agent routing:');
        for (var g = 0; g < agentNames.length; g++) {
          var ids = agentMap[agentNames[g]];
          if (agentNames[g] === 'unassigned') {
            lines.push('  Tasks ' + ids.join(', ') + ' -> no agent assigned (handle directly)');
          } else {
            lines.push('  Tasks ' + ids.join(', ') + ' -> ' + agentNames[g] + ' agent');
          }
        }
        lines.push('');
      }

      /* Parallel execution hint when tasks span multiple agents */
      var assignedAgents = agentNames.filter(function(a) { return a !== 'unassigned'; });
      if (assignedAgents.length > 1) {
        var parts = [];
        for (var p = 0; p < assignedAgents.length; p++) {
          parts.push('spawn ' + assignedAgents[p] + ' for ' + agentMap[assignedAgents[p]].join(', '));
        }
        lines.push('Parallelize: ' + parts.join(', '));
        lines.push('');
      }

      /* Team creation hint for 3+ distinct agents */
      if (assignedAgents.length >= 3) {
        lines.push('Tip: 3+ agents needed. Create a team: Use Agent tool to spawn a coordinator,');
        lines.push('then delegate each agent group as a parallel sub-task for maximum throughput.');
        lines.push('');
      }
    }

    lines.push('Workflow:');
    lines.push('1. Claim your first task: kanban-md pick --dir ~/.commandboard/workspaces/' + name + ' --claim');
    lines.push('2. Plan the implementation approach');
    lines.push('3. Execute in waves - delegate to teammates where possible');
    lines.push('4. Mark done: hq done ' + name + ' <id>');
    lines.push('5. Pick the next task and repeat');
    lines.push('');
    lines.push('Update the board as you work. When finished: hq sync --no-open');

    return lines.join('\n');
  }

  function renderKanban(name) {
    var container = document.getElementById('view-kanban');
    clear(container);

    var tasks = WORKSPACES[name] || [];

    /* Two-column top: Executive Summary (left) + Execution Prompt (right) */
    var activeTasks = tasks.filter(function(t) { return t.status !== 'done'; });

      /* Left: Executive Summary */
      var summaryBox = el('div', 'exec-brief');
      var sumHeader = el('div', 'exec-brief-header');

      sumHeader.appendChild(txt('span', name.toUpperCase() + ' BRIEF', 'exec-brief-title'));
      summaryBox.appendChild(sumHeader);

      var sumBody = el('div', 'exec-brief-body');

      var briefText = BRIEFING && BRIEFING.projects && BRIEFING.projects[name]

      var sumP = el('p');

      var doing = tasks.filter(function(t) { return t.status === 'doing'; }).length;

      var metricsP = el('p');

      metricParts.push(pct + '% complete');

      if (critical > 0) metricParts.push(critical + ' critical');
      metricsP.textContent = metricParts.join(' \u00b7 ');
      sumBody.appendChild(metricsP);

      /* Top tickets */
      var topTickets = activeTasks.slice().sort(sortByPriorityThenStatus).slice(0, 3);
      if (topTickets.length > 0) {
        var ticketListP = el('p');
        ticketListP.style.marginTop = '8px';
        ticketListP.style.fontSize = '11px';
        for (var ti = 0; ti < topTickets.length; ti++) {
          var tLine = el('div');
          tLine.style.padding = '2px 0';
          var tId = el('span');
          tId.style.color = 'var(--accent)';

          ticketListP.appendChild(tLine);
        }

      }

      summaryBox.appendChild(sumBody);
      topSplit.appendChild(summaryBox);

      /* Right: Execution Prompt */
      var promptBox = el('div', 'exec-prompt');
      promptBox.style.margin = '0';

      var promptHeader = el('div', 'exec-prompt-header');
      var promptLabel = el('span', 'exec-prompt-label');
      promptLabel.textContent = 'EXECUTION PROMPT';
      promptHeader.appendChild(promptLabel);

      var copyBtn = el('button', 'exec-prompt-copy');
      copyBtn.textContent = 'Copy to Clipboard';
      var promptText = generateExecPrompt(name, tasks);
      copyBtn.addEventListener('click', function() {
        navigator.clipboard.writeText(promptText).then(function() {
          copyBtn.textContent = 'Copied!';
          copyBtn.classList.add('copied');
          setTimeout(function() {
            copyBtn.textContent = 'Copy to Clipboard';
            copyBtn.classList.remove('copied');
          }, 2000);
        });
      });
      promptHeader.appendChild(copyBtn);
      promptBox.appendChild(promptHeader);

      var textBox = el('pre', 'exec-prompt-text');

      promptBox.appendChild(textBox);

      container.appendChild(topSplit);

    var board = el('div', 'board');

    var tasksByStatus = {};
    for (var c = 0; c < COLUMNS.length; c++) {
      tasksByStatus[COLUMNS[c]] = [];

        tasksByStatus[status].push(tasks[t]);

    for (var ci = 0; ci < COLUMNS.length; ci++) {

        /* Sort tasks by priority within each column */
        colTasks.sort(sortByPriorityThenStatus);

        for (var j = 0; j < colTasks.length; j++) {
          (function(task) {
            task._workspace = task._workspace || name;
            var ticketId = getTicketId(name, task);
            var priMap = { critical: 'ticket-p0', high: 'ticket-p1', medium: 'ticket-p2', low: 'ticket-p3' };
            var card = el('div', 'ticket-card ' + (priMap[task.priority] || 'ticket-p3'));

            if (task.priority === 'critical' && col !== 'done') card.classList.add('ticket-critical');
            if (col === 'done') {
              card.classList.add('ticket-done');

            var header = el('div', 'ticket-header');
            header.appendChild(txt('span', ticketId, 'ticket-id'));
            var statusBadge = el('span', 'ticket-status-badge status-' + (task.status || 'backlog'));
            statusBadge.textContent = task.status || 'backlog';
            header.appendChild(statusBadge);
            card.appendChild(header);

            /* Title */
            card.appendChild(txt('div', task.title, 'ticket-title'));

            /* Detail rows */
            var details = el('div', 'ticket-details');

            if (task.assignee) {
              var assignRow = el('div', 'ticket-detail-row');
              assignRow.appendChild(txt('span', '\u2699', 'ticket-detail-icon'));
              assignRow.appendChild(document.createTextNode(task.assignee));
              details.appendChild(assignRow);
            }

            /* Sub-tasks */
            var subTasks = parseSubTasks(task.body);
            if (subTasks) {
              var stDone = subTasks.filter(function(s) { return s.done; }).length;
              var stRow = el('div', 'ticket-detail-row');
              stRow.appendChild(txt('span', '\u2611', 'ticket-detail-icon'));
              stRow.appendChild(document.createTextNode('Sub-tasks: ' + stDone + '/' + subTasks.length));
              var stBar = el('div', 'ticket-subtask-bar');
              var stFill = el('div', 'ticket-subtask-fill');
              stFill.style.width = Math.round((stDone / subTasks.length) * 100) + '%';
              stBar.appendChild(stFill);
              stRow.appendChild(stBar);
              details.appendChild(stRow);
            }

            /* Linked PR */
            var linkedPR = parseLinkedPR(task.body);
            if (linkedPR) {
              var prRow = el('div', 'ticket-detail-row');
              prRow.appendChild(txt('span', '\u{1F517}', 'ticket-detail-icon'));
              prRow.appendChild(document.createTextNode('PR ' + linkedPR));
              details.appendChild(prRow);
            }

            /* Due date */
            if (task.due) {
              var dueRow = el('div', 'ticket-detail-row');
              dueRow.appendChild(txt('span', '\u{1F4C5}', 'ticket-detail-icon'));
              var dueText = document.createTextNode('Due: ' + task.due);
              if (isOverdue(task.due) && task.status !== 'done') {
                var overdue = el('span', 'ticket-due-overdue');
                overdue.textContent = 'Due: ' + task.due + ' (overdue)';
                dueRow.appendChild(overdue);
              } else {
                dueRow.appendChild(dueText);
              }
              details.appendChild(dueRow);

            if (details.childNodes.length > 0) card.appendChild(details);

            /* Labels */
            var allLabels = (task.tags || []).concat(task.labels || []);
            if (allLabels.length > 0) {
              var labels = el('div', 'ticket-labels');
              for (var li = 0; li < Math.min(allLabels.length, 3); li++) {
                labels.appendChild(txt('span', allLabels[li], 'ticket-label'));
              }
              card.appendChild(labels);
            }

            /* Footer */
            var footer = el('div', 'ticket-footer');
            footer.appendChild(document.createTextNode(task.created ? 'Created ' + task.created : ''));
            card.appendChild(footer);

            /* D4: Dispatch buttons — 3 Copy buttons (claude / codex / droid).
             * Only rendered when DISPATCH_MAP has dispatch_prompts for this task.
             * Backward compat: tasks without dispatch_prompts render with no buttons.
             * DOM-only construction — no user data set via innerHTML (XSS-safe). */
            var dispatchPrompts = DISPATCH_MAP[String(task.id)];
            if (dispatchPrompts) {
              var dispatchRow = el('div', 'task-dispatch-row');
              var cliDefs = [
                { cli: 'claude', label: 'Claude', promptKey: 'claude' },
                { cli: 'codex',  label: 'Codex',  promptKey: 'codex'  },
                { cli: 'droid',  label: 'Droid',  promptKey: 'droid'  }
              ];
              for (var di = 0; di < cliDefs.length; di++) {
                (function(def) {
                  var prompt = dispatchPrompts[def.promptKey];
                  if (!prompt) return;
                  var btn = el('button', 'task-dispatch-btn');
                  btn.setAttribute('data-cli', def.cli);
                  btn.setAttribute('aria-label', 'Copy ' + def.label + ' prompt');
                  var iconSpan = el('span');
                  iconSpan.style.opacity = '0.7';
                  iconSpan.textContent = '📋';
                  btn.appendChild(iconSpan);
                  btn.appendChild(document.createTextNode(' ' + def.label));
                  btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var origNodes = [];
                    btn.childNodes.forEach(function(n) { origNodes.push(n.cloneNode(true)); });
                    function restoreBtn() {
                      while (btn.firstChild) btn.removeChild(btn.firstChild);
                      origNodes.forEach(function(n) { btn.appendChild(n.cloneNode(true)); });
                      btn.classList.remove('task-dispatch-btn--copied');
                    }
                    if (!navigator.clipboard) {
                      btn.textContent = '⚠ No clipboard';
                      setTimeout(restoreBtn, 2000);
                      return;
                    }
                    navigator.clipboard.writeText(prompt).then(function() {
                      btn.textContent = '✓ Copied!';
                      btn.classList.add('task-dispatch-btn--copied');
                      setTimeout(restoreBtn, 1500);
                    }).catch(function(err) {
                      btn.textContent = '✗ Failed';
                      console.error('Clipboard write failed:', err);
                      setTimeout(restoreBtn, 2000);
                    });
                  });
                  dispatchRow.appendChild(btn);
                })(cliDefs[di]);
              }
              if (dispatchRow.childNodes.length > 0) card.appendChild(dispatchRow);
            }

            card.addEventListener('click', function() { showTaskModal(task); });
            cardsWrap.appendChild(card);
          })(colTasks[j]);
        }

        colDiv.appendChild(cardsWrap);
        board.appendChild(colDiv);
      })(COLUMNS[ci]);
    }

    container.appendChild(board);

  /* ── Render: Search ── */

  var previousView = 'overview';

  function renderSearch(query) {
    var container = document.getElementById('view-search');
    clear(container);

    var scroll = el('div', 'search-results');

    if (!query || query.length < 2) {
      var hint = el('div', 'search-empty');
      hint.appendChild(txt('div', '\u2315', 'search-empty-icon'));
      hint.appendChild(txt('div', 'Type at least 2 characters to search'));
      scroll.appendChild(hint);
      container.appendChild(scroll);
      return;
    }

    var q = query.toLowerCase();
    var allTasks = getAllTasks();
    var matches = allTasks.filter(function(t) {
      return (t.title && t.title.toLowerCase().indexOf(q) >= 0) ||
        (t.body && t.body.toLowerCase().indexOf(q) >= 0) ||
        (t.assignee && t.assignee.toLowerCase().indexOf(q) >= 0) ||
        (t.tags && t.tags.join(' ').toLowerCase().indexOf(q) >= 0);
    });

    var countEl = el('div', 'search-count');
    countEl.textContent = matches.length + ' result' + (matches.length !== 1 ? 's' : '') + ' for "' + query + '"';
    scroll.appendChild(countEl);

    if (matches.length === 0) {
      var empty = el('div', 'search-empty');
      empty.appendChild(txt('div', '\u2205', 'search-empty-icon'));
      empty.appendChild(txt('div', 'No tasks match "' + query + '"'));
      scroll.appendChild(empty);
      container.appendChild(scroll);
      return;
    }

    /* Group by workspace */
    var groups = {};
    var groupOrder = [];
    for (var i = 0; i < matches.length; i++) {
      var ws = matches[i]._workspace || 'unknown';
      if (!groups[ws]) {
        groups[ws] = [];
        groupOrder.push(ws);
      }
      groups[ws].push(matches[i]);
    }

    for (var g = 0; g < groupOrder.length; g++) {
      var wsName = groupOrder[g];
      var wsTasks = groups[wsName];

      var group = el('div', 'search-result-group');

      var header = el('div', 'search-result-group-header');
      var groupDot = el('span', 'project-group-dot');
      groupDot.style.background = getWorkspaceColor(wsName);
      header.appendChild(groupDot);
      header.appendChild(document.createTextNode(wsName));
      var badge = txt('span', wsTasks.length.toString(), 'today-section-count');
      badge.style.marginLeft = '6px';
      header.appendChild(badge);
      group.appendChild(header);

      for (var j = 0; j < wsTasks.length; j++) {
        (function(task) {
          var row = el('div', 'compact-task');

          row.appendChild(createStatusDot(task.status));

          var titleEl = el('span', 'compact-task-title');
          /* Highlight matching text */
          var titleText = task.title || '';
          var lowerTitle = titleText.toLowerCase();
          var matchIdx = lowerTitle.indexOf(q);
          if (matchIdx >= 0) {
            titleEl.appendChild(document.createTextNode(titleText.slice(0, matchIdx)));
            var mark = el('span', 'search-match');
            mark.textContent = titleText.slice(matchIdx, matchIdx + query.length);
            titleEl.appendChild(mark);
            titleEl.appendChild(document.createTextNode(titleText.slice(matchIdx + query.length)));
          } else {
            titleEl.textContent = titleText;
          }
          row.appendChild(titleEl);

          if (task.assignee) {
            var ab = createAgentBadge(task.assignee);
            if (ab) row.appendChild(ab);
          }

          var prioTag = el('span', 'compact-task-priority priority-' + task.priority);
          prioTag.textContent = task.priority;
          row.appendChild(prioTag);

          row.addEventListener('click', function() {
            showTaskModal(task);
          });

          group.appendChild(row);
        })(wsTasks[j]);
      }

      scroll.appendChild(group);
    }

    container.appendChild(scroll);
  }

  /* ── Render: Burndown Chart ── */

  function createBurndownChart(allTasks) {
    var width = 400;
    var height = 80;
    var padding = { top: 8, right: 12, bottom: 20, left: 32 };
    var chartW = width - padding.left - padding.right;
    var chartH = height - padding.top - padding.bottom;

    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', height);
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    svg.style.display = 'block';

    /* Gather completion dates */
    var dateCounts = {};
    var total = allTasks.length;

    for (var i = 0; i < allTasks.length; i++) {
      var t = allTasks[i];
      if (t.status === 'done') {
        var dateStr = (t.completed || t.updated || t.created || '').slice(0, 10);
        if (dateStr) {
          dateCounts[dateStr] = (dateCounts[dateStr] || 0) + 1;
        }
      }
    }

    var dates = Object.keys(dateCounts).sort();

    if (dates.length < 2) {
      /* Not enough data for a chart — show message */
      var msg = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      msg.setAttribute('x', width / 2);
      msg.setAttribute('y', height / 2);
      msg.setAttribute('text-anchor', 'middle');
      msg.setAttribute('dominant-baseline', 'central');
      msg.setAttribute('fill', cssVar('--text-faint'));
      msg.setAttribute('font-size', '11');
      msg.setAttribute('font-family', 'inherit');
      msg.textContent = 'Complete tasks over multiple days to see burndown';
      svg.appendChild(msg);
      return svg;
    }

    /* Build data points: remaining tasks over time */
    var remaining = total;
    var points = [];
    var cumDone = 0;

    /* Start from first date */
    for (var d = 0; d < dates.length; d++) {
      cumDone += dateCounts[dates[d]];
      points.push({ date: dates[d], remaining: total - cumDone, done: cumDone });
    }

    var maxRemaining = total;
    var minRemaining = Math.min.apply(null, points.map(function(p) { return p.remaining; }));

    /* Scale */
    function xScale(idx) {
      return padding.left + (idx / (points.length - 1)) * chartW;
    }
    function yScale(val) {
      var range = maxRemaining - minRemaining || 1;
      return padding.top + (1 - (val - minRemaining) / range) * chartH;
    }

    /* Grid line */
    var gridLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    gridLine.setAttribute('x1', padding.left);
    gridLine.setAttribute('x2', padding.left + chartW);
    gridLine.setAttribute('y1', yScale(minRemaining));
    gridLine.setAttribute('y2', yScale(minRemaining));
    gridLine.setAttribute('stroke', cssVar('--border'));
    gridLine.setAttribute('stroke-dasharray', '3 3');
    svg.appendChild(gridLine);

    /* Area fill */
    var areaPoints = '';
    for (var a = 0; a < points.length; a++) {
      areaPoints += xScale(a) + ',' + yScale(points[a].remaining) + ' ';
    }
    areaPoints += xScale(points.length - 1) + ',' + (padding.top + chartH) + ' ';
    areaPoints += xScale(0) + ',' + (padding.top + chartH);

    var area = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    area.setAttribute('points', areaPoints);
    area.setAttribute('fill', cssVar('--accent-glow'));
    svg.appendChild(area);

    /* Line */
    var linePoints = '';
    for (var l = 0; l < points.length; l++) {
      linePoints += xScale(l) + ',' + yScale(points[l].remaining) + ' ';
    }
    var polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    polyline.setAttribute('points', linePoints.trim());
    polyline.setAttribute('fill', 'none');
    polyline.setAttribute('stroke', cssVar('--accent'));
    polyline.setAttribute('stroke-width', '2');
    polyline.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(polyline);

    /* Dots */
    for (var p = 0; p < points.length; p++) {
      var dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', xScale(p));
      dot.setAttribute('cy', yScale(points[p].remaining));
      dot.setAttribute('r', '3');
      dot.setAttribute('fill', cssVar('--accent'));
      svg.appendChild(dot);
    }

    /* X-axis labels (first and last date) */
    var firstLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    firstLabel.setAttribute('x', padding.left);
    firstLabel.setAttribute('y', height - 2);
    firstLabel.setAttribute('fill', cssVar('--text-faint'));
    firstLabel.setAttribute('font-size', '9');
    firstLabel.setAttribute('font-family', 'inherit');
    firstLabel.textContent = dates[0].slice(5);
    svg.appendChild(firstLabel);

    var lastLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lastLabel.setAttribute('x', padding.left + chartW);
    lastLabel.setAttribute('y', height - 2);
    lastLabel.setAttribute('text-anchor', 'end');
    lastLabel.setAttribute('fill', cssVar('--text-faint'));
    lastLabel.setAttribute('font-size', '9');
    lastLabel.setAttribute('font-family', 'inherit');
    lastLabel.textContent = dates[dates.length - 1].slice(5);
    svg.appendChild(lastLabel);

    /* Y-axis labels */
    var yTop = document.createElementNS('http://www.w3.org/2000/svg', 'text');

  /* ── Render: Activity Log ── */

  function renderActivity() {
    var container = document.getElementById('view-activity');
    clear(container);

    var scroll = el('div', 'activity-view');

    /* Collect all tasks with timestamps */
    var events = [];
    var allTasks = getAllTasks();

    for (var i = 0; i < allTasks.length; i++) {
      var t = allTasks[i];

      if (t.status === 'done' && (t.completed || t.updated)) {
        events.push({
          type: 'done',
          icon: '\u2713',
          iconClass: 'activity-icon-done',
          label: 'Completed',
          task: t,
          date: t.completed || t.updated
        });
      } else if (t.status === 'doing') {
        events.push({
          type: 'doing',
          icon: '\u25B6',
          iconClass: 'activity-icon-doing',
          label: 'In progress',
          task: t,
          date: t.updated || t.created
        });
      } else if (t.status === 'review') {
        events.push({
          type: 'review',
          icon: '\u25C9',
          iconClass: 'activity-icon-review',
          label: 'In review',
          task: t,
          date: t.updated || t.created
        });
      } else if (t.created) {
        events.push({
          type: 'created',
          icon: '+',
          iconClass: 'activity-icon-created',
          label: 'Created',
          task: t,
          date: t.created
        });
      }
    }

    /* Sort by date descending */
    events.sort(function(a, b) {
      return (b.date || '').localeCompare(a.date || '');
    });

    if (events.length === 0) {
      var empty = el('div', 'empty-state');
      var emptyIcon = el('div', 'empty-state-icon');
      emptyIcon.textContent = '\u25B6';
      empty.appendChild(emptyIcon);
      empty.appendChild(txt('div', 'No activity recorded yet'));
      scroll.appendChild(empty);
      container.appendChild(scroll);
      return;
    }

    for (var e = 0; e < Math.min(events.length, 50); e++) {
      (function(evt) {
        var item = el('div', 'activity-item');

        var iconBox = el('div', 'activity-icon ' + evt.iconClass);
        iconBox.textContent = evt.icon;
        item.appendChild(iconBox);

        var body = el('div', 'activity-body');

        var title = el('div', 'activity-title');
        title.textContent = evt.task.title;
        body.appendChild(title);

        var meta = el('div', 'activity-meta');

        var statusLabel = el('span');
        statusLabel.textContent = evt.label;
        meta.appendChild(statusLabel);

        var wsDot = el('span', 'stat-dot');
        wsDot.style.background = getWorkspaceColor(evt.task._workspace);
        wsDot.style.width = '5px';
        wsDot.style.height = '5px';
        meta.appendChild(wsDot);

        var wsLabel = el('span');
        wsLabel.textContent = evt.task._workspace;
        meta.appendChild(wsLabel);

        if (evt.task.assignee) {
          var agentLabel = el('span');
          agentLabel.style.color = 'var(--text-faint)';
          agentLabel.textContent = '\u2699 ' + evt.task.assignee;
          meta.appendChild(agentLabel);
        }

        if (evt.date) {
          var timeLabel = el('span', 'activity-time');
          timeLabel.textContent = evt.date;
          meta.appendChild(timeLabel);
        }

        body.appendChild(meta);
        item.appendChild(body);

        item.style.cursor = 'pointer';
        item.addEventListener('click', function() {
          showTaskModal(evt.task);
        });

        scroll.appendChild(item);
      })(events[e]);
    }

    container.appendChild(scroll);
  }

  /* ── Render: Dispatch Center ── */

  function formatElapsed(startedStr) {
    if (!startedStr) return '--';
    var started = new Date(startedStr);
    var now = new Date();
    var diffMs = now - started;
    var diffMin = Math.floor(diffMs / 60000);
    if (diffMin < 60) return diffMin + 'm';
    var diffHr = Math.floor(diffMin / 60);
    var remMin = diffMin % 60;
    return diffHr + 'h ' + remMin + 'm';
  }

  function getAgentStatusClass(agent) {
    if (agent.status === 'completed' || agent.status === 'exited' || agent.status === 'stopped') return 'completed';
    if (!agent.started) return 'completed';
    var activityTime = agent.last_activity || agent.started;
    var diffMs = new Date() - new Date(activityTime);
    if (diffMs > 30 * 60000) return 'stale'; /* stale after 30min since last activity */
    return 'running';
  }

  /* ── Dispatch: state for live polling + activity feed ── */
  var _dispatchEngine = (DISPATCH_CONFIG.global && DISPATCH_CONFIG.global.default_engine) || 'claude';
  var _activityLog = []; /* { time, type: 'start'|'stop'|'complete', msg } */
  var _prevAgentPids = {};
  var _showAllAgents = false; /* toggle for debug: show sss-orchestration + infra noise */

  function _filterDispatchAgents(agents) {
    if (_showAllAgents) return agents;
    return agents.filter(function(a) {
      /* Always show dispatch-spawned agents */
      if (a.source === 'dispatch') return true;
      /* Show manual agents that have a ticket_id (real work) */
      if (a.source === 'manual' && a.ticket_id) return true;
      /* Show running agents with real PIDs (not synthetic) */
      if (a.status === 'running' && a.pid && a.pid > 0) return true;
      /* Exclude sss-orchestration noise */
      if (a.source === 'sss-orchestration') return false;
      /* Exclude team infrastructure agents without ticket_ids */
      if (a.source === 'team' && !a.ticket_id) return false;
      /* Show anything else that has a ticket_id */
      if (a.ticket_id) return true;
      return false;
    });
  }

  function _dispatchPost(url, body, btn, successText) {
    btn.disabled = true;
    btn.textContent = 'Dispatching...';
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r) { return r.json(); }).then(function(d) {
      if (d.error) {
        btn.textContent = 'Error: ' + d.error;
      } else {
        btn.textContent = successText || 'Dispatched!';
      }
      setTimeout(function() { btn.disabled = false; btn.textContent = btn.getAttribute('data-label'); }, 3000);
    }).catch(function() {
      btn.textContent = 'Failed';
      setTimeout(function() { btn.disabled = false; btn.textContent = btn.getAttribute('data-label'); }, 3000);
    });
  }

  function _buildCpuBar(cpuPct) {
    var wrap = el('div', 'cpu-bar-wrap');
    var fill = el('div', 'cpu-bar-fill');
    var pct = Math.min(cpuPct || 0, 100);
    fill.style.width = pct + '%';
    fill.className += pct > 80 ? ' high' : (pct > 40 ? ' mid' : ' low');
    wrap.appendChild(fill);
    wrap.title = (cpuPct || 0).toFixed(1) + '% CPU';
    return wrap;
  }

  function _diffAgentActivity(newAgents) {
    var now = new Date();
    var timeStr = (now.getHours() < 10 ? '0' : '') + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
    var newPids = {};

    for (var i = 0; i < newAgents.length; i++) {
      var a = newAgents[i];
      if (a.status === 'running') {
        newPids[a.pid] = a;
        if (!_prevAgentPids[a.pid]) {
          _activityLog.unshift({ time: timeStr, type: 'start', msg: (a.agent_name || a.title || 'Agent') + ' started' + (a.workspace ? ' in ' + a.workspace : '') });
        }
      }
      if (a.status === 'completed' && _prevAgentPids[a.pid]) {
        _activityLog.unshift({ time: timeStr, type: 'complete', msg: (a.agent_name || a.title || 'Agent') + ' completed' });
      }
    }

    for (var pid in _prevAgentPids) {
      if (!newPids[pid]) {
        var old = _prevAgentPids[pid];
        var found = false;
        for (var j = 0; j < newAgents.length; j++) {
          if (newAgents[j].pid == pid && newAgents[j].status === 'completed') { found = true; break; }
        }
        if (!found) {
          _activityLog.unshift({ time: timeStr, type: 'stop', msg: (old.agent_name || old.title || 'Agent') + ' stopped' });
        }
      }
    }

    _prevAgentPids = newPids;
    if (_activityLog.length > 50) _activityLog.length = 50;
  }

  function _groupAgentsByWorkspace(agents) {
    var groups = {};
    var ungrouped = [];
    for (var i = 0; i < agents.length; i++) {
      var a = agents[i];
      var ws = a.workspace || a.cmux_workspace || a.tmux_session || null;
      if (ws) {
        if (!groups[ws]) groups[ws] = [];
        groups[ws].push(a);
      } else {
        ungrouped.push(a);
      }
    }
    if (ungrouped.length > 0) groups['other'] = ungrouped;
    return groups;
  }

  var _dumpFilter = null; /* active theme filter or null = all */

  function renderDumps() {
    var container = document.getElementById('view-dumps');
    clear(container);

    var scroll = el('div', 'dumps-scroll');

    /* Header */
    var header = el('div', 'dumps-header');
    header.appendChild(txt('span', 'BRAIN DUMPS', 'dumps-header-title'));
    header.appendChild(txt('span', DUMPS_DATA.length, 'dumps-count'));
    scroll.appendChild(header);

    /* Collect all unique themes for filter pills */
    var allThemes = {};
    for (var d = 0; d < DUMPS_DATA.length; d++) {
      for (var t = 0; t < DUMPS_DATA[d].themes.length; t++) {
        allThemes[DUMPS_DATA[d].themes[t]] = (allThemes[DUMPS_DATA[d].themes[t]] || 0) + 1;
      }
    }
    var themeNames = Object.keys(allThemes).sort();

    if (themeNames.length > 0) {
      var filterRow = el('div', 'dumps-filter-row');
      var allPill = txt('span', 'All', 'dumps-filter-pill');
      if (!_dumpFilter) allPill.classList.add('active');
      allPill.addEventListener('click', function() { _dumpFilter = null; renderDumps(); });
      filterRow.appendChild(allPill);
      for (var fi = 0; fi < themeNames.length; fi++) {
        (function(theme) {
          var pill = txt('span', theme + ' (' + allThemes[theme] + ')', 'dumps-filter-pill');
          if (_dumpFilter === theme) pill.classList.add('active');
          pill.addEventListener('click', function() { _dumpFilter = theme; renderDumps(); });
          filterRow.appendChild(pill);
        })(themeNames[fi]);
      }
      scroll.appendChild(filterRow);
    }

    /* Filter dumps */
    var filtered = DUMPS_DATA;
    if (_dumpFilter) {
      filtered = [];
      for (var fd = 0; fd < DUMPS_DATA.length; fd++) {
        if (DUMPS_DATA[fd].themes.indexOf(_dumpFilter) !== -1) filtered.push(DUMPS_DATA[fd]);
      }
    }

    /* Grid of cards */
    var grid = el('div', 'dumps-grid');

    // themeColors: extend with your project names and colors
    var themeColors = {
      'Personal': { bg: 'var(--gold-dim)', color: 'var(--gold)', border: 'rgba(251,191,36,0.3)' },
      'SigmaHQ': { bg: 'var(--cyan-dim)', color: 'var(--cyan)', border: 'rgba(6,182,212,0.3)' },
      'Discord': { bg: 'var(--blue-dim)', color: 'var(--blue)', border: 'rgba(59,130,246,0.3)' }
    };

    for (var i = 0; i < filtered.length; i++) {
      (function(dump) {
        var card = el('div', 'dump-card');

        /* Date */
        var dateStr = dump.date || dump.filename;
        if (dump.date) {
          var parts = dump.date.split('-');
          var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          dateStr = months[parseInt(parts[1], 10) - 1] + ' ' + parseInt(parts[2], 10) + ', ' + parts[0];
        }
        card.appendChild(txt('div', dateStr, 'dump-card-date'));

        /* Title */
        card.appendChild(txt('div', dump.title, 'dump-card-title'));

        /* Theme tags */
        if (dump.themes.length > 0) {
          var themesRow = el('div', 'dump-card-themes');
          for (var ti = 0; ti < dump.themes.length; ti++) {
            var tag = txt('span', dump.themes[ti], 'dump-theme-tag');
            var tc = themeColors[dump.themes[ti]] || { bg: 'var(--surface-raised)', color: 'var(--text-dim)', border: 'var(--border)' };
            tag.style.background = tc.bg;
            tag.style.color = tc.color;
            tag.style.border = '1px solid ' + tc.border;
            themesRow.appendChild(tag);
          }
          card.appendChild(themesRow);
        }

        /* Preview */
        card.appendChild(txt('div', dump.preview, 'dump-card-preview'));

        /* Expanded content */
        var expanded = el('div', 'dump-expanded');
        expanded.textContent = dump.content || '';
        card.appendChild(expanded);

        /* Footer */
        var footer = el('div', 'dump-card-footer');
        var sizeKb = (dump.size / 1024).toFixed(1) + ' KB';
        footer.appendChild(txt('span', sizeKb, 'dump-card-size'));
        footer.appendChild(txt('span', 'click to expand', 'dump-expand-hint'));
        card.appendChild(footer);

        /* Click to expand/collapse */
        card.addEventListener('click', function() {
          card.classList.toggle('open');
          var hint = card.querySelector('.dump-expand-hint');
          if (hint) hint.textContent = card.classList.contains('open') ? 'click to collapse' : 'click to expand';
        });

        grid.appendChild(card);
      })(filtered[i]);
    }

    if (filtered.length === 0) {
      var empty = el('div', 'dispatch-empty');
      empty.textContent = _dumpFilter ? 'No dumps match filter "' + _dumpFilter + '"' : 'No brain dumps found in ~/.commandboard/dumps/';
      grid.appendChild(empty);
    }

    scroll.appendChild(grid);
    container.appendChild(scroll);
  }

  searchInput.addEventListener('input', function() {
    var query = searchInput.value.trim();

    clearTimeout(searchDebounce);

      if (query.length >= 2) {
        if (currentView !== 'search') {
          previousView = currentView;
        }
        switchView('search');
        renderTopbar();
        renderSearch(query);
      } else if (currentView === 'search') {
        switchView(previousView || 'dashboard');
        renderTopbar();
        if (previousView === 'dashboard') renderDashboard();
        else if (previousView === 'dispatch') renderDispatch();
        else if (previousView === 'overview') renderOverview();
        else if (previousView === 'today') renderToday();
        else if (previousView === 'calendar') renderCalendar();
        else if (previousView === 'activity') renderActivity();
        else if (previousView === 'dumps') renderDumps();
        else if (previousView === 'content') renderContent();
      }
    }, 200);
  });

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      searchInput.value = '';
      if (currentView === 'search') {
        switchView(previousView || 'dashboard');
        renderTopbar();
        if (previousView === 'dashboard') renderDashboard();
